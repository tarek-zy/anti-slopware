<text x="938" y="314" class="mu" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" text-anchor="start">Leftover screenshots,</text>
