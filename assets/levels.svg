<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 208" width="1200" height="208" role="img" aria-label="Three levels: easy removes duplication, medium adds useless code, hard adds clarity and organisation">
<style>
.card{fill:#f6f8fa;stroke:#d1d9e0}.fg{fill:#1f2328}.mu{fill:#59636e}.ln{stroke:#d1d9e0}.chip{fill:#ffffff;stroke:#d1d9e0}
@media (prefers-color-scheme: dark){.card{fill:#161b22;stroke:#30363d}.fg{fill:#e6edf3}.mu{fill:#8b949e}.ln{stroke:#30363d}.chip{fill:#0d1117;stroke:#30363d}}
</style>
<rect x="1" y="1" width="398" height="58" rx="12" class="card" stroke-width="1.5"/>
<rect x="1" y="1" width="150" height="58" rx="12" fill="#2da44e" opacity="0.16"/>
<circle cx="28" cy="30" r="7" fill="#2da44e"/>
<text x="48" y="37" class="fg" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" font-weight="700" text-anchor="start">easy</text>
<text x="170" y="36" class="mu" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Duplicated code</text>
<rect x="1" y="75" width="798" height="58" rx="12" class="card" stroke-width="1.5"/>
<rect x="1" y="75" width="150" height="58" rx="12" fill="#db6d28" opacity="0.16"/>
<circle cx="28" cy="104" r="7" fill="#db6d28"/>
<text x="48" y="111" class="fg" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" font-weight="700" text-anchor="start">medium</text>
<text x="170" y="110" class="mu" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">+ unused, unreachable and leftover code</text>
<rect x="1" y="149" width="1198" height="58" rx="12" class="card" stroke-width="1.5"/>
<rect x="1" y="149" width="150" height="58" rx="12" fill="#e5534b" opacity="0.16"/>
<circle cx="28" cy="178" r="7" fill="#e5534b"/>
<text x="48" y="185" class="fg" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" font-weight="700" text-anchor="start">hard</text>
<text x="170" y="184" class="mu" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">+ nesting, unclear names, bare numbers, disorganised code</text>
</svg>
